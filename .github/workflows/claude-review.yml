name: Claude review

# Claude Code reviews every PR on open and on each new push, and answers @claude in PR comments
# from people with write access. It runs on Max's Claude plan through CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`), not an API key. Advisory: it comments; the merge is Max's word.
# Same file in each of Max's build repos; the source of record is blueandyellow44/cord-cutter.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: claude-review
    # A PR event, or a comment that mentions @claude from someone with write access.
    if: >-
      github.event_name == 'pull_request' ||
      (contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Review the PR
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1 (2026-11-01)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. First read CLAUDE.md and .greptile/config.json if they exist: they hold
            this repo's own rules. Report correctness and security problems with inline comments on the exact
            lines, each with a concrete failing case (an exact input that gets the wrong result). Skip style the
            gates already enforce. If you find nothing, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
      - name: Answer @claude
        if: github.event_name != 'pull_request'
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1 (2026-11-01)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
